15) Create ResourceQuota (limit) in dev namespace to set limit resource to create pods,cpu,memory particular namespace
apiVersion: v1
kind: ResourceQuota
metadata:
  name: dev-rq
  namespace: dev
spec:
  hard:
    pods: "5"
    limits.cpu: "1"
    limits.memory: 2Gi

16) Create ResourceQuota (limit and Request) in dev namespace to set limit resource to create pods,cpu,memory particular namespace
apiVersion: v1
kind: ResourceQuota
metadata:
  name: dev-rq
  namespace: dev
spec:
  hard:
    pods: "5"
    requests.cpu: "2"
    requests.memory: "2Gi"
    limits.cpu: "4"
    limits.memory: "6Gi"

