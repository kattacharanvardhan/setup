19) Create manifest file for node selector to schedule pod in particular node with mentioned label(its hard value and its gurantee to schedule in that label attched to node only)

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodeselector
  labels:
    app: bank
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bank
  template:
    metadata:
      labels:
        app: bank
    spec:
      containers:
        - name: cont1
          image: charanvardhan/internetbanking:v1
      nodeSelector:
        node-name: ib-node

