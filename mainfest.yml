        - name: bank-cont
          image: charanvardhan/internetbanking:v1

10) Create Deployment and Service Clusterip(with clusterip we cant expose our application to outside) within cluster only we can access 
apiVersion: apps/v1
kind: Deployment
metadata:
  name: banking-dp
  labels:
    app: bank
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bank
  template:
    metadata:
      labels:
        app: bank
    spec:
      containers:
        - name: bank-cont
          image: charanvardhan/loans:v1
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: banking-svc
spec:
  type: ClusterIP
  selector:
    app: bank
  ports:
    - port: 80
      targetPort: 80

11) Create Deployment and Service NodePort (we can expose application to outside world but with static port number like ec2 node ip public addr and node port range 30000-32767) http://3.6.88.232:31122/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: banking-dp
  labels:
    app: bank
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bank
  template:
    metadata:
      labels:
        app: bank
    spec:
      containers:
        - name: bank-cont
          image: charanvardhan/loans:v1
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: banking-svc
spec:
  type: NodePort
  selector:
    app: bank
  ports:
    - port: 80 ==> its service port
      targetPort: 80 ==> its pod's container port
      nodePort: 31122 ==> its node port

