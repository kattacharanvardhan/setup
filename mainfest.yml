17) Create SideCar(if there is relation btw 2 container its sidecar=== like one container have app and other container have database or one container is generating logs and 2 container is put logs to somewhere
apiVersion: v1
kind: Pod
metadata:
  name: log-aggregator-pod

spec:
  containers:
    - name: app-container
      image: alpine
      command: ["/bin/sh", "-c"]
      args:
        - "while true; do date >> /var/log/app.log; sleep 5; done"
      volumeMounts:
        - name: shared-logs
          mountPath: /var/log

    - name: sidecar-container
      image: nginx
      volumeMounts:
        - name: shared-logs
          mountPath: /usr/share/nginx/html

  volumes:
    - name: shared-logs
      emptyDir: {}

18) Create Ingress Controller(its like path based routing) in ingress controller have path rewrites (user-lb-ingresscontroller-service-deployment)

its --> nginx.yml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx
          ports:
            - containerPort: 80
          env:
            - name: TITLE
              value: "NGINX APP1"

---
apiVersion: v1
kind: Service
metadata:
  name: nginx
spec:
  type: ClusterIP
  selector:
    app: nginx
  ports:
    - port: 80

